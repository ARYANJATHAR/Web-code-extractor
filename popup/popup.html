<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Extractor — HTML, CSS, React, Tailwind</title>
  <meta name="description" content="Extract clean HTML, CSS, React and Tailwind from any element on any website.">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="1" y="1" width="26" height="26" rx="7" fill="#16181d" stroke="#2a2e37"/>
          <path d="M10.5 9.5 8 14l2.5 4.5" stroke="#e8eaf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17.5 9.5 20 14l-2.5 4.5" stroke="#8b93a7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Code Extractor</h1>
        <p class="subtitle">HTML · CSS · React · Tailwind — any site</p>
      </div>
      <span class="state-pill" id="pickerState" role="status">
        <span class="state-dot" aria-hidden="true"></span><span id="pickerStateText">Idle</span>
      </span>
    </header>

    <section class="actions" aria-label="Extraction actions">
      <button id="togglePicker" class="btn btn-primary" type="button">
        <svg class="btn-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="5.2" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="8" cy="8" r="1.4" fill="currentColor"/>
          <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span class="btn-label">Select element</span>
      </button>
      <button id="extractPage" class="btn btn-ghost" type="button">
        <svg class="btn-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="2.5" y="2" width="11" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span class="btn-label">Full page</span>
      </button>
    </section>

    <nav class="tabs" aria-label="Output format">
      <button class="tab active" data-tab="html" type="button">HTML</button>
      <button class="tab" data-tab="css" type="button">CSS</button>
      <button class="tab" data-tab="react" type="button">React</button>
      <button class="tab" data-tab="tailwind" type="button">Tailwind</button>
      <button class="tab" data-tab="mapped" type="button">Mapped</button>
      <button class="tab" data-tab="combined" type="button">Combined</button>
    </nav>

    <section class="editor" aria-label="Code output">
      <div class="editor-header">
        <span class="dot" aria-hidden="true"></span>
        <span class="editor-title" id="editorTitle">HTML</span>
        <span class="editor-meta" id="charCount">0 chars</span>
        <button id="copyCode" class="btn btn-mini" type="button">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10.5 5.5v-2a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3.5v5A1.5 1.5 0 0 0 4 10h1.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span>Copy</span>
        </button>
      </div>
      <div class="editor-body">
        <pre id="codeOutput"><code>Select an element on the page, or run a full-page extraction. Output appears here.</code></pre>
      </div>
    </section>

    <section class="options" aria-label="Element picker options">
      <div class="section-label">Element picker options</div>
      <p class="options-note">These settings apply when selecting an element, not to full-page extraction.</p>
      <label class="switch-row">
        <span class="switch-text">Include child elements</span>
        <input type="checkbox" id="includeChildren" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>
      <label class="switch-row">
        <span class="switch-text">Extract computed styles</span>
        <input type="checkbox" id="includeComputed">
        <span class="switch" aria-hidden="true"></span>
      </label>
      <label class="switch-row">
        <span class="switch-text">Clean framework classes</span>
        <input type="checkbox" id="cleanWebflow">
        <span class="switch" aria-hidden="true"></span>
      </label>
    </section>

    <section class="history" aria-label="Extraction history">
      <div class="history-header">
        <span class="section-label">History</span>
        <button id="clearHistory" class="link-btn" type="button">Clear</button>
      </div>
      <ul id="historyList" class="history-list">
        <li class="history-empty">No extractions yet</li>
      </ul>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script src="../lib/messaging.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
